name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - run: pip install pre-commit
      - run: pre-commit run --all-files

  core-api-tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: orbit
          POSTGRES_PASSWORD: orbit
          POSTGRES_DB: orbit_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U orbit"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DJANGO_SETTINGS_MODULE: config.settings.test
      DATABASE_URL: postgres://orbit:orbit@localhost:5432/orbit_test
      REDIS_URL: redis://localhost:6379/0
      CELERY_BROKER_URL: redis://localhost:6379/1
      CELERY_RESULT_BACKEND: redis://localhost:6379/2
    defaults:
      run:
        working-directory: services/core_api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - run: pip install -r requirements/dev.txt
      - run: pytest --cov=apps --cov-report=xml --junitxml=junit.xml
      - uses: actions/upload-artifact@v4
        with:
          name: core-api-coverage
          path: services/core_api/coverage.xml

  notification-service-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/notification_service
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - run: pip install -r requirements.txt
      - run: pytest --junitxml=junit.xml

  docker-build:
    runs-on: ubuntu-latest
    needs: [core-api-tests, notification-service-tests]
    steps:
      - uses: actions/checkout@v4
      - name: Build core-api image
        run: docker build --build-arg REQUIREMENTS_FILE=requirements/prod.txt -t orbit/core-api:ci services/core_api
      - name: Build notification-service image
        run: docker build -t orbit/notification-service:ci services/notification_service
