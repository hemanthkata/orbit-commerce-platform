apiVersion: apps/v1
kind: Deployment
metadata:
  name: celery-worker
  namespace: orbit
spec:
  replicas: 2
  selector:
    matchLabels: {app: celery-worker}
  template:
    metadata:
      labels: {app: celery-worker}
    spec:
      containers:
        - name: celery-worker
          image: orbit/core-api:latest
          command: ["celery", "-A", "config", "worker", "-l", "info", "--concurrency=4"]
          envFrom:
            - {configMapRef: {name: orbit-config}}
            - {secretRef: {name: orbit-secrets}}
          resources:
            requests: {cpu: "200m", memory: "256Mi"}
            limits: {cpu: "1", memory: "512Mi"}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: celery-beat
  namespace: orbit
spec:
  replicas: 1  # Beat MUST run as a single instance - duplicate schedulers
               # would double-fire every periodic task.
  selector:
    matchLabels: {app: celery-beat}
  template:
    metadata:
      labels: {app: celery-beat}
    spec:
      containers:
        - name: celery-beat
          image: orbit/core-api:latest
          command:
            - celery
            - -A
            - config
            - beat
            - -l
            - info
            - --scheduler
            - django_celery_beat.schedulers:DatabaseScheduler
          envFrom:
            - {configMapRef: {name: orbit-config}}
            - {secretRef: {name: orbit-secrets}}
          resources:
            requests: {cpu: "100m", memory: "128Mi"}
            limits: {cpu: "250m", memory: "256Mi"}
