apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: orbit-ingress
  namespace: orbit
  annotations:
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
spec:
  ingressClassName: nginx
  rules:
    - host: api.orbit.example.com
      http:
        paths:
          - path: /notifications
            pathType: Prefix
            backend:
              service: {name: notification-service, port: {number: 8001}}
          - path: /ws/notifications
            pathType: Prefix
            backend:
              service: {name: notification-service, port: {number: 8001}}
          - path: /
            pathType: Prefix
            backend:
              service: {name: core-api, port: {number: 8000}}
