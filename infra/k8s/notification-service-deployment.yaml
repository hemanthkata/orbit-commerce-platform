apiVersion: apps/v1
kind: Deployment
metadata:
  name: notification-service
  namespace: orbit
  labels: {app: notification-service}
spec:
  replicas: 2
  selector:
    matchLabels: {app: notification-service}
  template:
    metadata:
      labels: {app: notification-service}
    spec:
      containers:
        - name: notification-service
          image: orbit/notification-service:latest
          ports: [{containerPort: 8001}]
          envFrom:
            - {configMapRef: {name: orbit-config}}
            - {secretRef: {name: orbit-secrets}}
          readinessProbe:
            httpGet: {path: /health, port: 8001}
            initialDelaySeconds: 10
          livenessProbe:
            httpGet: {path: /health, port: 8001}
            initialDelaySeconds: 20
          resources:
            requests: {cpu: "100m", memory: "128Mi"}
            limits: {cpu: "500m", memory: "256Mi"}
---
apiVersion: v1
kind: Service
metadata:
  name: notification-service
  namespace: orbit
spec:
  selector: {app: notification-service}
  ports: [{port: 8001, targetPort: 8001}]
