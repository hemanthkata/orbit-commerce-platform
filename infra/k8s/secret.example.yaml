# Copy to secret.yaml, fill in real values, and DO NOT commit the filled-in
# version. In a real cluster this would instead be sourced from a secrets
# manager (Vault, AWS Secrets Manager, GCP Secret Manager) via the External
# Secrets Operator rather than a plain Kubernetes Secret manifest.
apiVersion: v1
kind: Secret
metadata:
  name: orbit-secrets
  namespace: orbit
type: Opaque
stringData:
  DJANGO_SECRET_KEY: "replace-me"
  DATABASE_URL: "postgres://orbit:replace-me@postgres:5432/orbit"
  SENTRY_DSN: ""
  NOTIF_SENTRY_DSN: ""
