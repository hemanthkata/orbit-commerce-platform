input {
  beats {
    port => 5044
  }
}

filter {
  # correlation_id (set by apps.common.middleware.RequestLoggingMiddleware)
  # lets Kibana pivot from a single request to every log line it produced,
  # including ones emitted later by a Celery task triggered from it.
  if [correlation_id] {
    mutate { add_field => { "[@metadata][correlation_id]" => "%{correlation_id}" } }
  }

  date {
    match => ["asctime", "ISO8601"]
    target => "@timestamp"
  }
}

output {
  elasticsearch {
    hosts => ["elasticsearch:9200"]
    index => "orbit-%{+YYYY.MM.dd}"
  }
}
